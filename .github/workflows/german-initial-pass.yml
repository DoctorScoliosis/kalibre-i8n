name: German initial translation pass

on:
  push:
    branches: ["translate/de-DE"]
    paths:
      - ".github/workflows/german-initial-pass.yml"

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: translate/de-DE

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Argos Translate
        run: python -m pip install --disable-pip-version-check argostranslate

      - name: Generate German locale
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          import argostranslate.package
          import argostranslate.translate

          ROOT = Path(".")
          SRC = ROOT / "locales" / "en-GB"
          DST = ROOT / "locales" / "de-DE"
          DST.mkdir(parents=True, exist_ok=True)

          argostranslate.package.update_package_index()
          package = next(
              p for p in argostranslate.package.get_available_packages()
              if p.from_code == "en" and p.to_code == "de"
          )
          argostranslate.package.install_from_path(package.download())

          protected_terms = [
              "Kalibre", "Feed", "Castle", "Space", "Spot",
              "Marathon", "Scroller", "WASD", "XP", "WPM", "KPM",
              "GitHub", "IndexedDB", "HTTP", "URL", "JSON", "MB", "GB",
          ]
          token_re = re.compile(r"https?://[^\s]+|<[^>]+>")

          def protect(text):
              saved = []
              def stash(value):
                  token = f"ZZZK{len(saved)}ZZZ"
                  saved.append(value)
                  return token
              text = token_re.sub(lambda m: stash(m.group(0)), text)
              for term in sorted(protected_terms, key=len, reverse=True):
                  text = re.sub(
                      rf"(?<![A-Za-z]){re.escape(term)}(?![A-Za-z])",
                      lambda m: stash(m.group(0)),
                      text,
                  )
              return text, saved

          def restore(text, saved):
              for i, value in enumerate(saved):
                  text = text.replace(f"ZZZK{i}ZZZ", value)
              return text

          def capitalise_first_word(text):
              match = re.search(r"[A-Za-zÄÖÜäöüßẞ]", text)
              if not match:
                  return text
              i = match.start()
              return text[:i] + text[i].upper() + text[i + 1:]

          def find_matching_brace(text, start):
              depth = 0
              for i in range(start, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return i
              raise ValueError("Unbalanced ICU braces")

          def split_icu_options(body):
              pairs = []
              cursor = 0
              while cursor < len(body):
                  while cursor < len(body) and body[cursor].isspace():
                      cursor += 1
                  key_start = cursor
                  while cursor < len(body) and not body[cursor].isspace() and body[cursor] != "{":
                      cursor += 1
                  key = body[key_start:cursor]
                  while cursor < len(body) and body[cursor].isspace():
                      cursor += 1
                  if not key or cursor >= len(body) or body[cursor] != "{":
                      break
                  end = find_matching_brace(body, cursor)
                  pairs.append((key, cursor, end))
                  cursor = end + 1
              return pairs

          def translate_leaf(text):
              if not text.strip() or not re.search(r"[A-Za-zÄÖÜäöüßẞ]", text):
                  return text
              masked, saved = protect(text)
              translated = argostranslate.translate.translate(masked, "en", "de")
              return capitalise_first_word(restore(translated, saved))

          def translate_message(text):
              parts = []
              cursor = 0
              i = 0
              while i < len(text):
                  if text[i] == "{":
                      end = find_matching_brace(text, i)
                      if cursor < i:
                          parts.append(("text", text[cursor:i]))
                      parts.append(("icu", text[i:end + 1]))
                      i = end + 1
                      cursor = i
                  else:
                      i += 1
              if cursor < len(text):
                  parts.append(("text", text[cursor:]))
              if not parts:
                  return text
              return "".join(
                  translate_leaf(value) if kind == "text" else translate_icu(value)
                  for kind, value in parts
              )

          def translate_icu(block):
              inner = block[1:-1]
              if "," not in inner:
                  return block
              variable, rest = inner.split(",", 1)
              rest = rest.lstrip()
              if "," not in rest:
                  return block
              kind, body = rest.split(",", 1)
              kind = kind.strip()
              if kind not in {"plural", "select", "selectordinal"}:
                  return block

              pairs = split_icu_options(body)
              if not pairs:
                  return block

              out = []
              cursor = 0
              for key, open_pos, close_pos in pairs:
                  out.append(body[cursor:open_pos])
                  out.append("{")
                  out.append(translate_message(body[open_pos + 1:close_pos]))
                  out.append("}")
                  cursor = close_pos + 1
              out.append(body[cursor:])
              return "{" + variable + ", " + kind + "," + "".join(out) + "}"

          def walk(value):
              if isinstance(value, dict):
                  return {k: walk(v) for k, v in value.items()}
              if isinstance(value, list):
                  return [walk(v) for v in value]
              if isinstance(value, str):
                  return translate_message(value)
              return value

          for source_path in sorted(SRC.glob("*.json")):
              if source_path.name in {"meta.json", "manifest.json"}:
                  continue
              source = json.loads(source_path.read_text(encoding="utf-8"))
              target = walk(source)
              (DST / source_path.name).write_text(
                  json.dumps(target, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

          meta = {
              "id": "de-DE",
              "name": "Deutsch",
              "englishName": "German",
              "dir": "ltr",
              "fallback": "en-GB",
              "lowercaseDates": True,
              "fonts": [
                  "system-ui", "-apple-system", "Segoe UI", "Roboto",
                  "Helvetica Neue", "Arial", "sans-serif"
              ],
              "reviewed": "machine",
              "revision": 1,
              "version": "2026-10-03",
              "changes": "Initial German candidate translation"
          }
          (DST / "meta.json").write_text(
              json.dumps(meta, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (DST / ".gitkeep").unlink(missing_ok=True)

      - name: Rebuild packs and validate German
        run: |
          node scripts/build-packs.mjs
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          import { validateCanonical, validateTranslation } from "./scripts/lib/integrity.mjs";

          const loadLocale = (dir) => {
            const files = {};
            for (const file of fs.readdirSync(dir)) {
              if (file.endsWith(".json")) {
                files[file.replace(/\.json$/, "")] = JSON.parse(
                  fs.readFileSync(path.join(dir, file), "utf8")
                );
              }
            }
            return files;
          };

          const canonical = validateCanonical(loadLocale("locales/en-GB"));
          if (canonical.errors.length) {
            console.error("Canonical en-GB validation failed:");
            console.error(canonical.errors.join("\n"));
            process.exit(1);
          }

          const german = loadLocale("locales/de-DE");
          const result = validateTranslation(canonical.messages, german, "de-DE");
          if (result.errors.length) {
            console.error("German validation failed:");
            console.error(result.errors.join("\n"));
            process.exit(1);
          }

          const index = JSON.parse(fs.readFileSync("index.json", "utf8"));
          const entry = index.locales.find((locale) => locale.id === "de-DE");
          if (!entry) {
            console.error("German locale is missing from index.json");
            process.exit(1);
          }

          const pack = fs.readFileSync(entry.pack, "utf8");
          const hash = crypto.createHash("sha256").update(pack).digest("hex");
          if (hash !== entry.sha256) {
            console.error("German pack hash does not match index.json");
            process.exit(1);
          }

          console.log(`de-DE validation passed: ${result.messages.size}/${canonical.messages.size} messages valid`);
          console.log("German pack checksum matches index.json");
          NODE

      - name: Commit German candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locales/de-DE packs/de-DE.json index.json
          git rm -f --ignore-unmatch .github/workflows/german-initial-pass.yml
          git commit -m "feat(de-DE): add initial German localisation"
          git push origin HEAD:translate/de-DE
